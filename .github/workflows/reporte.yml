name: Fantasy reporte

on:
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar
        run: pip install -r requirements.txt

      - name: Enviar reporte
        env:
          LEAGUE_ID: "1884225720"
          YEAR: "2026"
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "s2? ${ESPN_S2:+yes}"
          echo "swid? ${SWID:+yes}"
          echo "token? ${TELEGRAM_TOKEN:+yes}"
          echo "chat? ${TELEGRAM_CHAT_ID:+yes}"
          python send_report.py
